[project]
name = "pymol-mcp"
version = "0.1.0"
description = "MCP server that drives PyMOL (open-source) for molecular visualization and structural analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pymol-mcp contributors" }]
dependencies = [
    # Built against the mcp.server.mcpserver.MCPServer API, which is 2.x-only
    # (it replaced mcp.server.fastmcp.FastMCP from the 1.x line -- installing
    # an mcp<2.0 here breaks every import in this package).
    "mcp[cli]>=2.0.0",
    "pydantic>=2.0",
]

# pymol / pymol2 is intentionally NOT a hard dependency here: it is only
# imported lazily by the headless backend. Attach mode (xmlrpc.client) needs
# nothing beyond the standard library, so this package can be installed with
# plain pip even when PyMOL itself comes from a conda environment.

[project.optional-dependencies]
# pymol-open-source-whl only ships wheels for manylinux_2_28 x86_64, macOS
# (arm64/x86_64), and Windows amd64 -- there is no wheel for Linux aarch64
# (Jetson, Graviton, Ampere/Grace ARM servers, etc). The marker below keeps
# `uv sync --extra headless` from hard-failing the resolver there; on that
# platform, install PyMOL via conda-forge instead (see README).
headless = [
    "pymol-open-source-whl; sys_platform != 'linux' or platform_machine != 'aarch64'",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
pymol-mcp = "pymol_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymol_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
